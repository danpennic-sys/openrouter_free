[package]
name = "openrouter_free"
version = "0.1.0"
edition = "2021"
description = "Operator-grade, zero-friction Rust client for the OpenRouter free-model tier"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danpennic-sys/openrouter_free"
readme = "README.md"
keywords = ["openrouter", "llm", "ai", "async", "client"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
thiserror = "1"
async-stream = "0.3"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
serde_json = "1"
